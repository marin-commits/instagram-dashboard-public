const sc=d.createElement('script');sc.textContent=`(function(){
const c=n=>{n=Number(n||0);return n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(Math.round(n))};
function currentRows(){const days=document.querySelector('[data-days].active');const n=days?Number(days.dataset.days):30;const end=new Date(TODAY),start=new Date(end);start.setUTCDate(start.getUTCDate()-n);return MEDIA.filter(x=>{const t=new Date(x.timestamp);return t>=start&&t<=end})}
function perfChart(rows){const a=[...rows].sort((x,y)=>new Date(x.timestamp)-new Date(y.timestamp)).slice(-24);if(!a.length)return '';const W=760,H=235,L=40,B=26,T=12,max=Math.max(1,...a.map(x=>Math.max(+x.views||0,+x.reach||0))),step=(W-L-10)/a.length,bw=Math.max(3,Math.min(9,step*.24));let o='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';for(let i=0;i<4;i++){let y=T+(H-T-B)*i/3;o+='<line class="gridline" x1="'+L+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'"/><text class="axis" x="2" y="'+(y+3)+'">'+c(max*(1-i/3))+'</text>'}a.forEach((p,i)=>{let x=L+i*step+step/2,v=(+p.views||0)/max*(H-T-B),r=(+p.reach||0)/max*(H-T-B);o+='<rect class="barR" x="'+(x-bw-1)+'" y="'+(H-B-r)+'" width="'+bw+'" height="'+r+'" rx="3"/><rect class="barV" x="'+(x+1)+'" y="'+(H-B-v)+'" width="'+bw+'" height="'+v+'" rx="3"/>'});return o+'</svg>'}
function donut(rows){const reach=rows.reduce((a,x)=>a+(+x.reach||0),0),click=rows.filter(x=>x.bio_link_clicks!=null).reduce((a,x)=>a+(+x.bio_link_clicks||0),0),rate=reach?click/reach*100:0,ang=Math.max(2,Math.min(360,rate*36));return '<div><div class="donut" style="background:conic-gradient(#6c63ff 0 '+ang+'deg,#ececf3 '+ang+'deg 360deg)"><div class="center"><b>'+rate.toFixed(3)+'%</b><span>도달 대비 클릭률</span></div></div><div class="drows"><div class="drow"><span>도달 합계</span><b>'+c(reach)+'</b></div><div class="drow"><span>바이오 링크 클릭</span><b>'+click.toLocaleString('ko-KR')+'</b></div></div></div>'}
function bars(rows){const r=rows.reduce((a,x)=>a+(+x.reach||0),0)||1,d=[['좋아요',rows.reduce((a,x)=>a+(+x.likes||0),0)/r*100],['저장',rows.reduce((a,x)=>a+(+x.saved||0),0)/r*100],['공유',rows.reduce((a,x)=>a+(+x.shares||0),0)/r*100],['댓글',rows.reduce((a,x)=>a+(+x.comments||0),0)/r*100]],m=Math.max(.001,...d.map(x=>x[1]));return d.map(x=>'<div class="mrow"><div class="mname">'+x[0]+'</div><div class="track"><div class="fill" style="width:'+Math.max(2,x[1]/m*100)+'%"></div></div><div class="mval">'+x[1].toFixed(3)+'%</div></div>').join('')}
function mix(rows){const g={};rows.forEach(x=>g[x.category]=(g[x.category]||0)+(+x.views||0));const e=Object.entries(g).sort((a,b)=>b[1]-a[1]),t=e.reduce((a,x)=>a+x[1],0)||1,cols=['#6c63ff','#a78bfa','#d7d4ff','#4f46e5'];let a=0,st=e.map((x,i)=>{let s=a/t*360;a+=x[1];return cols[i%cols.length]+' '+s+'deg '+a/t*360+'deg'}).join(',');return '<div><div class="donut" style="background:conic-gradient('+st+')"><div class="center"><b>'+c(t)+'</b><span>총 조회수</span></div></div><div class="drows">'+e.map(x=>'<div class="drow"><span>'+x[0]+'</span><b>'+(x[1]/t*100).toFixed(1)+'%</b></div>').join('')+'</div></div>'}
